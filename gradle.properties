# ------------------------------------------------------------------ 本机相关配置放用户级
# 仓库内的 gradle.properties 只保留**可共享**的设置。本机相关的三项
# （org.gradle.java.home / installations.paths / ideaDependencyCachePath）已移到
# **用户级** gradle.properties，即 $GRADLE_USER_HOME/gradle.properties
# （未设置 GRADLE_USER_HOME 时为 %USERPROFILE%\.gradle\gradle.properties）。
# 放在仓库里的原因是不允许：
#   1) org.gradle.java.home 指向 D:/softwares/... 会让 Linux/macOS 的 CI 直接构建失败；
#   2) intellij.ideaDependencyCachePath 指向 G:/... 会在非 Windows 机器上创建名为 "G:" 的目录。
#
# 本机临时覆盖可用命令行参数：-Dorg.gradle.java.home=<jdk11 路径>
# 换机器 / 新克隆仓库时，把上述三项写进该机器的用户级 gradle.properties 即可。

# 不把 Kotlin 标准库打进插件 zip（官方要求，https://jb.gg/intellij-platform-kotlin-stdlib）。
# Kotlin stdlib 与 org.jetbrains:annotations 均由 IntelliJ Platform 自身提供，
# 插件再自带一份会与 IDE 内置版本冲突（IDEA 2022.1 内置 Kotlin 1.7.x，2024.2+ 已是 2.x）。
# IPGP 会把 IDE 自带的 stdlib 放到编译 classpath，因此编译/测试均不受影响。
# 设为 true 时 `gradlew verifyPluginConfiguration` 仍会报 stdlib 冲突告警。
kotlin.stdlib.default.dependency=false

kotlin.code.style=official

# ------------------------------------------------------------------ IPGP 自更新检查
# 关闭 Gradle IntelliJ Plugin 的「自更新检查」。
#
# 背景（2026-11-01 实测踩坑）：`initializeIntelliJPlugin` 任务默认会去 GitHub 拉
# "gradle-intellij-plugin 的最新版本"，用于打印升级提示：
#   URL("https://github.com/JetBrains/gradle-intellij-plugin/releases/latest")，
# 且**关闭了自动跟随重定向**（instanceFollowRedirects = false），直接取 `Location` 头。
# 在网络受限 / GitHub 限流 / 代理拦截重定向的环境里，该头为 null →
#   java.lang.NullPointerException: getHeaderField("Location") must not be null
# → 被包装成 GradleException("Cannot resolve the latest Gradle IntelliJ Plugin version")
# → **整个构建在 initializeIntelliJPlugin 阶段直接失败**（与本项目代码无关）。
#
# 该检查只是"提示你有新版本"，对本项目（锁定 IPGP 1.17.3 + Kotlin 1.7.22）没有价值，
# 反而在离线/受限网络下会阻断构建，故按 IPGP 官方开关关闭。
#
# 开关名来自 IPGP 源码 `BuildFeature.SELF_UPDATE_CHECK.toString()`：
#   org.jetbrains.intellij.buildFeature.selfUpdateCheck
# 另外两个等效跳过条件（见 InitializeIntelliJPluginTask.checkPluginVersion）：
#   - 命令行加 `--offline`（offline.convention = startParameter.isOffline）；
#   - 已存在当日锁文件 <temporaryDir>/<yyyy-MM-dd>。
org.jetbrains.intellij.buildFeature.selfUpdateCheck=false