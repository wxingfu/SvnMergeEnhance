# ------------------------------------------------------------------ 本机相关配置放这里
# 仓库内的 gradle.properties 只保留可共享的设置；本机相关的两项已移到用户级文件
# （%USERPROFILE%\.gradle\gradle.properties），否则：
#   1) org.gradle.java.home 指向 D:/softwares/... 会让 Linux/macOS 的 CI 直接构建失败；
#   2) intellij.ideaDependencyCachePath 指向 G:/... 会在非 Windows 机器上创建名为 "G:" 的目录。
#
# 如需在本机临时覆盖，可用命令行参数：-Dorg.gradle.java.home=<jdk11 路径>

# 不把 Kotlin 标准库打进插件 zip（官方要求，https://jb.gg/intellij-platform-kotlin-stdlib）。
# Kotlin stdlib 与 org.jetbrains:annotations 均由 IntelliJ Platform 自身提供，
# 插件再自带一份会与 IDE 内置版本冲突（IDEA 2022.1 内置 Kotlin 1.7.x，2024.2+ 已是 2.x）。
# IPGP 会把 IDE 自带的 stdlib 放到编译 classpath，因此编译/测试均不受影响。
# 设为 true 时 `gradlew verifyPluginConfiguration` 仍会报 stdlib 冲突告警。
kotlin.stdlib.default.dependency=false

kotlin.code.style=official