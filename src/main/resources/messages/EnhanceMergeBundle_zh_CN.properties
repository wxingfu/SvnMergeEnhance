# 设置页（T9 / Spec R11）
settings.display.name=SVN 增强合并
settings.page.size=每页版本数
settings.page.size.hint=版本列表首屏以及每次「加载更多」加载的版本条数（10–500）。默认 100，与 TortoiseSVN 一致。
settings.compute.merge.status=计算已合并状态
settings.compute.merge.status.hint=为每行版本显示「已合并 / 外来 / 计算中」图标，并在变更文件列表中标记已合并文件。需要读取仓库的 svn:mergeinfo。
settings.bug.id.pattern=Bug-ID 正则
settings.bug.id.pattern.hint=勾选 Bug-IDs 过滤字段时，用于从提交说明中提取 Bug-ID 的正则表达式。
settings.default.date.range=默认日期范围（天）
settings.default.date.range.hint=大于 0 时，过滤栏的日期区间默认填「最近 N 天」；0 表示不限制。

dialog.title.select.merge.variant=选择合并方式
button.revision.select=版本选择
button.cancel=取消
variant.revision.select.explanation=显示目标分支上的全部版本（已合并与未合并）。\n用于手动选择要合并的版本。

