name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v3

      - name: Compile, unit tests, official package verification
        # chmod 是兜底：Windows 上提交的 gradlew 容易丢可执行位（git 记 100644），
        # 在 Linux runner 上直接 ./gradlew 会以 exit 126 "Permission denied" 失败。
        run: chmod +x gradlew && ./gradlew build test verifyPlugin --stacktrace

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: SvnMergeEnhance-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  plugin-verifier:
    name: Plugin Verifier (2022.1 / 2026.3)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v3

      - name: Run IntelliJ Plugin Verifier
        # 同样兜底 chmod。**只校验下限 IC-2022.1**：
        # 1) 2026 起 Community/Ultimate 合并，上限要写 IU-2026.3（独立 IC 条目已无）；
        # 2) 但两端一起下会撑爆 runner 磁盘（2022.1 包 814MB + 2026.3 包 1.5GB，
        #    再加解压与缓存，实测会报 Insufficient space for shared memory file）。
        # 上限回归改由本机 `-PverifierLocalIde=<IU-2026.3 统一发行版目录>` 完成，见 README
        # （不能用 ideaIC-2026.3：Marketplace 对 IC-263.* 解析不到 Subversion 依赖）。
        run: chmod +x gradlew && ./gradlew runPluginVerifier -PverifierIdeVersions=IC-2022.1 --stacktrace

      - name: Upload verifier report
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
