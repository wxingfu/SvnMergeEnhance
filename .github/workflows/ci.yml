name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v3

      - name: Compile, unit tests, official package verification
        run: ./gradlew build test verifyPlugin --stacktrace

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: SvnMergeEnhance-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  plugin-verifier:
    name: Plugin Verifier (IDEA 2022.1)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v3

      - name: Run IntelliJ Plugin Verifier
        run: ./gradlew runPluginVerifier --stacktrace

      - name: Upload verifier report
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
