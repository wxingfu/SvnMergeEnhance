name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v3

      - name: Compile, unit tests, official package verification
        # chmod 是兜底：Windows 上提交的 gradlew 容易丢可执行位（git 记 100644），
        # 在 Linux runner 上直接 ./gradlew 会以 exit 126 "Permission denied" 失败。
        run: chmod +x gradlew && ./gradlew build test verifyPlugin --stacktrace

      - name: Upload plugin distribution
        uses: actions/upload-artifact@v4
        with:
          name: SvnMergeEnhance-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  plugin-verifier:
    name: Plugin Verifier (2022.1 / 2026.2.3)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: gradle/actions/setup-gradle@v3

      - name: Run IntelliJ Plugin Verifier
        # 同样兜底 chmod；两端 IDE 由 build.gradle.kts 的 ideVersions 指定并自动下载
        #（上限用 IU-2026.2.3：2026 起 Community/Ultimate 合并，code=IC 已无条目）
        run: chmod +x gradlew && ./gradlew runPluginVerifier --stacktrace

      - name: Upload verifier report
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier
          if-no-files-found: ignore
